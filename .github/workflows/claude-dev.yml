name: Claude Dev Wing

# Manual-trigger slice of the "Dev Wing" plan (Phase 1): comment "@claude"
# on an issue or PR and Claude Code reads the repo, does the work, and opens
# a PR — no D.R.O.I.D. coordinator or app UI wired up yet, this is just the
# execution engine on its own so it can be tested directly.
#
# Needs the ANTHROPIC_API_KEY repository secret (Settings → Secrets and
# variables → Actions) to run at all — added 2026-08-17.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
