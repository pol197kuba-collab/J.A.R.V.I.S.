<title>JARVIS Login Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*FONTS*/
:root{
  color-scheme:dark;
  --background:#030a13;--foreground:#e3f6f9;--muted-foreground:#76c7cc;
  --primary:#00e6f9;--accent:#73bdff;--reactor:#ffad00;--reactor-hot:#ffcd42;--destructive:#ff5a4a;
  --radius:1.25rem;
  --font-display:"Share Tech Mono","JetBrains Mono",ui-monospace,monospace;
  --font-body:"JetBrains Mono","Share Tech Mono",ui-monospace,monospace;
  --glow-primary:0 0 12px color-mix(in oklab,var(--primary) 80%,transparent),0 0 36px color-mix(in oklab,var(--primary) 35%,transparent);
  --grid-bg:linear-gradient(color-mix(in oklab,var(--primary) 5%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in oklab,var(--primary) 5%,transparent) 1px,transparent 1px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--foreground);font:400 14px/1.6 var(--font-body)}
#scene{position:fixed;inset:0;width:100vw;height:100lvh;display:block}
:focus-visible{outline:2px solid var(--reactor-hot);outline-offset:3px}
#grid{position:fixed;inset:0;pointer-events:none;background-image:var(--grid-bg);background-size:40px 40px;animation:grid-pan 20s linear infinite;opacity:.55;mix-blend-mode:screen;z-index:1}
@keyframes grid-pan{to{background-position:40px 40px,40px 40px}}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.95) 100%);z-index:1}
#ark{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0}
.tick{position:fixed;width:24px;height:24px;border:0 solid color-mix(in oklab,var(--primary) 70%,transparent);z-index:5;pointer-events:none}
.tick.tl{left:16px;top:16px;border-width:2px 0 0 2px}.tick.tr{right:16px;top:16px;border-width:2px 2px 0 0}
.tick.bl{left:16px;bottom:16px;border-width:0 0 2px 2px}.tick.br{right:16px;bottom:16px;border-width:0 2px 2px 0}

.btn{position:relative;display:inline-block;font:400 13px/1 var(--font-display);letter-spacing:.34em;text-transform:uppercase;color:var(--primary);border:1px solid color-mix(in oklab,var(--primary) 70%,transparent);background:color-mix(in oklab,var(--primary) 10%,transparent);padding:15px 22px;cursor:pointer;box-shadow:var(--glow-primary);transition:background .2s,color .2s}
.btn:hover{background:color-mix(in oklab,var(--primary) 22%,transparent);color:var(--foreground)}
.btn::before,.btn::after{content:"";position:absolute;width:8px;height:8px;border:0 solid var(--primary)}
.btn::before{left:-1px;top:-1px;border-width:1px 0 0 1px}.btn::after{right:-1px;bottom:-1px;border-width:0 1px 1px 0}
.btn.quiet{box-shadow:none;border-color:color-mix(in oklab,var(--primary) 40%,transparent);background:color-mix(in oklab,var(--background) 40%,transparent);color:var(--foreground);padding:11px 14px;font-size:11px;letter-spacing:.24em}
.hud{position:relative;overflow:hidden;border-radius:var(--radius);padding:22px;
  background:linear-gradient(180deg,color-mix(in oklab,var(--primary) 7%,#0a1420 88%),rgba(4,10,19,.86));
  border:1px solid color-mix(in oklab,var(--primary) 32%,transparent);
  box-shadow:0 0 34px -12px color-mix(in oklab,var(--primary) 60%,transparent);backdrop-filter:blur(10px)}
.hud::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 50% -20%,color-mix(in oklab,var(--primary) 18%,transparent),transparent 60%);pointer-events:none}
.hud>*{position:relative}
.tag{display:flex;justify-content:space-between;gap:12px;font:400 11px/1.3 var(--font-display);letter-spacing:.24em;text-transform:uppercase;color:color-mix(in oklab,var(--primary) 85%,transparent);margin:0 0 8px}
.tag i{font-style:normal;color:var(--muted-foreground)}

/* login: same stack as StarkLogin, with the 3D reactor where the SVG used to be */
.brand{position:fixed;z-index:5;left:44px;top:30px;font:400 13px/1 var(--font-display);letter-spacing:.34em;color:var(--primary);pointer-events:none}
#login{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:6px;padding:12px 16px;overflow-y:auto;scrollbar-width:none;pointer-events:none}
#login::-webkit-scrollbar{display:none}
#slot{flex:none;aspect-ratio:1;width:min(52vmin,250px);pointer-events:none}
.lform{width:min(400px,92vw);flex:none;display:grid;gap:12px;pointer-events:auto;animation:fade-up .7s .5s ease-out both}
@keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lhead{text-align:center}
.lhead p{font:400 10px/1.3 var(--font-display);letter-spacing:.5em;text-transform:uppercase;color:color-mix(in oklab,var(--primary) 80%,transparent);margin:0}
.lhead h2{font:400 19px/1.2 var(--font-display);letter-spacing:.3em;margin:8px 0 0}
.lform label{display:grid;gap:3px;font:400 10px/1.3 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground)}
.lform input{width:100%;border:1px solid color-mix(in oklab,var(--primary) 40%,transparent);background:color-mix(in oklab,var(--background) 60%,transparent);padding:9px 12px;font:400 14px/1.4 var(--font-body);color:var(--foreground);border-radius:0}
.lform .btn{width:100%;letter-spacing:.4em}
#lmsg{min-height:1.4em;margin:0;text-align:center;font:400 11px/1.4 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--destructive)}
.lform.err{border-color:var(--destructive);animation:err-flash .5s ease-out}
@keyframes err-flash{0%{box-shadow:0 0 40px -4px var(--destructive)}100%{box-shadow:0 0 34px -12px color-mix(in oklab,var(--primary) 60%,transparent)}}
.leaving .lform{animation:fracture .45s ease-in forwards;pointer-events:none}
@keyframes fracture{0%{opacity:1;clip-path:inset(0);transform:none}100%{opacity:0;clip-path:inset(0 50% 0 50%);transform:scale(1.05)}}
.leaving .brand{opacity:0;transition:opacity .4s}

/* Arc Core HUD: appears at P_LIVE and is usable straight away */
#core-hit{position:fixed;inset:0;z-index:6;display:none;touch-action:none;cursor:grab}
#core-ui{position:fixed;inset:0;z-index:7;visibility:hidden;opacity:0;pointer-events:none}
#core-ui>*{pointer-events:auto}
#top{position:absolute;left:44px;right:44px;top:28px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none}
#top>*{pointer-events:auto}
.mtitle{font:700 clamp(14px,1.6vw,18px)/1.3 var(--font-display);letter-spacing:.3em;margin:0;color:color-mix(in oklab,var(--primary) 90%,transparent);text-shadow:0 0 16px color-mix(in oklab,var(--primary) 60%,transparent)}
.msub{font:400 10px/1.4 var(--font-body);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55);margin:6px 0 0}
.user{display:flex;align-items:center;gap:12px;font:400 11px/1 var(--font-display);letter-spacing:.14em;color:var(--muted-foreground)}
#side{position:absolute;right:44px;top:112px;width:260px;display:grid;gap:10px}
#roster{display:grid;gap:6px;padding:12px}
.chip{display:flex;gap:10px;align-items:center;text-align:left;width:100%;cursor:pointer;color:var(--foreground);font:inherit;background:transparent;border:1px solid color-mix(in oklab,var(--primary) 18%,transparent);padding:8px 10px;transition:background .2s,border-color .2s}
.chip:hover,.chip[aria-pressed=true]{background:color-mix(in oklab,var(--primary) 14%,transparent);border-color:color-mix(in oklab,var(--primary) 60%,transparent)}
.chip i{font:400 11px/1 var(--font-display);color:var(--primary);font-style:normal}
.chip b{display:block;font:400 12px/1.2 var(--font-display);letter-spacing:.16em}
.chip em{display:block;font:400 9.5px/1.3 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground);font-style:normal}
#detail{display:none;padding:14px 16px;font-size:12.5px}
#detail.on{display:block}#detail p{margin:0}
#hint{position:absolute;left:44px;bottom:30px;margin:0;font:400 11px/1.4 var(--font-display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted-foreground)}
#labels .nl{position:fixed;left:0;top:0;z-index:5;opacity:0;text-align:center;pointer-events:none;white-space:nowrap;will-change:transform}
.nl b{display:block;font:400 13px/1.3 var(--font-display);letter-spacing:.2em;color:var(--foreground)}
.nl span{display:block;font:400 10px/1.4 var(--font-display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted-foreground)}
.nl.on b{color:var(--reactor-hot)}#l-core b{color:var(--reactor-hot)}

/* demo panel (not part of the product) */
#demo{position:fixed;right:16px;bottom:16px;z-index:9;width:290px;font:400 11px/1.5 var(--font-display);letter-spacing:.08em;background:rgba(4,10,19,.86);border:1px solid color-mix(in oklab,var(--primary) 35%,transparent);backdrop-filter:blur(10px);padding:10px 12px}
#demo summary{cursor:pointer;letter-spacing:.3em;color:var(--primary);text-transform:uppercase}
#demo .row{display:flex;gap:6px;margin:8px 0}
#demo button{flex:1;font:inherit;letter-spacing:.04em;color:var(--foreground);background:transparent;border:1px solid color-mix(in oklab,var(--primary) 35%,transparent);padding:7px 4px;cursor:pointer}
#demo button[aria-pressed=true]{background:color-mix(in oklab,var(--primary) 22%,transparent);border-color:var(--primary);color:var(--primary)}
#demo button:hover{border-color:var(--primary)}
#tl{position:relative;height:6px;background:color-mix(in oklab,var(--primary) 14%,transparent);margin:12px 0 6px}
#tlf{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--primary);box-shadow:0 0 8px var(--primary)}
#tlm{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--reactor-hot)}
#demo p{margin:4px 0 0;color:var(--muted-foreground)}
.idle #stat::after{content:" · idle: 30 FPS";color:var(--reactor-hot)}
.no-webgl #scene{display:none}.no-webgl #slot{background:radial-gradient(circle,color-mix(in oklab,var(--primary) 60%,transparent),transparent 65%);border-radius:50%}

@media (max-width:760px){
  .brand{left:34px;top:26px}
  #top{left:20px;right:20px;top:22px}.user span{display:none}
  #side{left:16px;right:16px;top:auto;bottom:70px;width:auto}
  #roster{display:flex;overflow-x:auto;scrollbar-width:none;padding:8px}#roster::-webkit-scrollbar{display:none}
  .chip{width:auto;flex:none}.chip em{display:none}
  #hint{display:none}
  .nl span{display:none}
  #demo{width:min(290px,calc(100vw - 24px));right:12px;top:62px;bottom:auto}
  .btn{padding:14px 16px;letter-spacing:.22em;font-size:12.5px}
}
@media (max-height:640px){#slot{width:min(30vmin,130px)}.lform{gap:8px;padding:14px}}
@media (prefers-reduced-motion:reduce){#grid{animation:none}.lform{animation:none}}
</style>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="grid"></div><div id="vig"></div><div id="ark"></div>
<i class="tick tl"></i><i class="tick tr"></i><i class="tick bl"></i><i class="tick br"></i>
<div class="brand">J.A.R.V.I.S.</div>

<div id="login">
  <div id="slot"></div>
  <form class="hud lform" id="login-form" autocomplete="off">
    <div class="lhead"><p>Stark Industries // Mark VII</p><h2>SECURE LOGIN</h2></div>
    <label for="op">Operator Email<input id="op" type="email" value="demo@jarvis.local"></label>
    <label for="key">Cipher Key<input id="key" type="password" value="demo"></label>
    <p id="lmsg" role="alert"></p>
    <button class="btn" type="submit">▸ Request Access</button>
  </form>
</div>

<div id="core-hit"></div>
<div id="core-ui">
  <div id="top">
    <div><p class="mtitle">J.A.R.V.I.S. // STARK AGENT MATRIX</p><p class="msub">5 / 5 agentów online · sieć delegacji na żywo</p></div>
    <div class="user"><span>demo@jarvis.local</span><button class="btn quiet" id="out" type="button">Wyloguj</button></div>
  </div>
  <div id="side"><div class="hud" id="roster" role="group" aria-label="Agenci"></div><div class="hud" id="detail" aria-live="polite"></div></div>
  <p id="hint">Przeciągnij, żeby obrócić · kliknij agenta · Esc zamyka</p>
</div>
<div id="labels"></div>

<details id="demo" open>
  <summary>Demo</summary>
  <div class="row"><button data-eff="full" type="button">Pełne 2,4 s</button><button data-eff="short" type="button">Powrót 0,9 s</button><button data-eff="min" type="button">Min. ruchu</button></div>
  <div class="row"><button id="bad" type="button">Złe hasło</button><button id="again" type="button">Zaloguj / wyloguj</button></div>
  <div id="tl"><i id="tlf"></i><b id="tlm" style="left:58%"></b></div>
  <p id="tlt">Wpisz hasło i zaloguj. Klik lub klawisz pomija animację.</p>
  <p id="stat"></p>
</details>

<script>/*BUNDLE*/</script>
